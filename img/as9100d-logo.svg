<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90">
  <style>
    .as-title {
      font-family: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
      font-weight: 900;
      font-style: italic;
      fill: #FFFFFF;
      font-size: 38px;
    }
    .as-subtitle {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      fill: #FFFFFF;
      font-size: 13.5px;
      letter-spacing: 5.5px;
    }
  </style>
  <g>
    <!-- Jet Aircraft forming the letter 'A' -->
    <!-- Jet Fuselage & Nose -->
    <path d="M 54,6 L 62,11 L 43,38 L 82,34 L 76,41 L 40,43 L 32,54 L 54,92 L 40,78 L 26,49 L 6,49 L 24,42 L 34,24 Z" fill="#FFFFFF" />
    
    <!-- Right leg of 'A' -->
    <path d="M 54,6 L 66,6 L 77,44 L 64,44 Z" fill="#FFFFFF" />

    <!-- Jet Stream Horizontal Line -->
    <path d="M 38,44 L 274,44 C 278,44 280,45 280,45.5 C 280,46 278,47 274,47 L 38,47 Z" fill="#FFFFFF" />

    <!-- S9100D Text -->
    <text x="75" y="40" class="as-title">S9100D</text>

    <!-- CERTIFIED Text -->
    <text x="77" y="66" class="as-subtitle">CERTIFIED</text>
  </g>
</svg>
